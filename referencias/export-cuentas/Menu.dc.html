<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Familjen Grotesk',sans-serif;-webkit-font-smoothing:antialiased}
a{color:#8A5F1F}
a:hover{color:#1A1A17}
</style>
</helmet>
<div style="{{ vars }}">

<sc-if value="{{ esc }}" hint-placeholder-val="{{ true }}">
<aside data-screen-label="Menú escritorio" style="width:232px;min-height:1024px;box-sizing:border-box;border:1px solid var(--ln,#E4DFD4);background:var(--bg,#FAF8F3);color:var(--tx,#1A1A17);font-family:'Familjen Grotesk',sans-serif;padding:28px 16px;display:flex;flex-direction:column;gap:28px">
<div style="padding:0 8px;font-size:20px;font-weight:700;letter-spacing:0.16em">TINO</div>
<button style="height:44px;display:flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:4px;background:var(--tx,#1A1A17);color:var(--bg,#FAF8F3);font-family:'Familjen Grotesk',sans-serif;font-size:15px;font-weight:600;cursor:pointer"><span style="display:flex">{{ ic.plus }}</span>Registrar</button>
<nav style="display:flex;flex-direction:column;gap:2px">
<sc-for list="{{ nav }}" as="n" hint-placeholder-count="8">
<div onClick="{{ n.pick }}" style="height:40px;display:flex;align-items:center;gap:12px;padding:0 8px;border-radius:4px;background:{{ n.bg }};color:{{ n.color }};font-size:15px;font-weight:{{ n.weight }};cursor:pointer"><span style="display:flex">{{ n.icon }}</span><span style="flex:1">{{ n.label }}</span><span style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--br,#8A5F1F)">{{ n.badge }}</span></div>
</sc-for>
</nav>
<div style="margin-top:auto;padding:0 8px;display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--t2,#6B6760)"><span>TRM de referencia</span><span style="font-family:'IBM Plex Mono',monospace;font-size:15px;color:var(--tx,#1A1A17)">4.120 COP</span><span>18 nov 2026</span></div>
</aside>
</sc-if>

<sc-if value="{{ mov }}" hint-placeholder-val="{{ false }}">
<div data-screen-label="Menú móvil" style="width:390px;height:844px;position:relative;overflow:hidden;box-sizing:border-box;border:1px solid var(--ln,#E4DFD4);background:var(--bg,#FAF8F3);color:var(--tx,#1A1A17);font-family:'Familjen Grotesk',sans-serif">
<div style="height:48px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 30px 6px;font-size:15px;font-weight:600"><span>9:41</span><span style="font-size:12px">5G</span></div>
<div style="padding:12px 16px 0"><h1 style="margin:0;font-size:28px;line-height:34px;font-weight:600;letter-spacing:-0.01em">{{ title }}</h1></div>

<sc-if value="{{ sheet }}" hint-placeholder-val="{{ false }}">
<div onClick="{{ closeSheet }}" style="position:absolute;inset:0;background:var(--bg,#FAF8F3);opacity:0.6"></div>
<div style="position:absolute;left:0;right:0;bottom:84px;background:var(--sf,#FFFFFF);border-top:1px solid var(--lf,#1A1A17);border-radius:6px 6px 0 0;padding:4px 16px 12px">
<div style="height:48px;display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--t2,#6B6760)"><span>Más secciones</span><button onClick="{{ closeSheet }}" style="height:44px;padding:0 4px;background:none;border:none;font-family:'Familjen Grotesk',sans-serif;font-size:15px;letter-spacing:0;text-transform:none;color:var(--t2,#6B6760);cursor:pointer">Cerrar</button></div>
<sc-for list="{{ more }}" as="m" hint-placeholder-count="5">
<div onClick="{{ m.pick }}" style="min-height:52px;display:grid;grid-template-columns:20px minmax(0,1fr) auto 16px;gap:12px;align-items:center;border-top:1px solid var(--ln,#E4DFD4);color:{{ m.color }};font-weight:{{ m.weight }};cursor:pointer"><span style="display:flex;color:var(--t2,#6B6760)">{{ m.icon }}</span><span style="font-size:15px">{{ m.label }}</span><span style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--br,#8A5F1F)">{{ m.badge }}</span><span style="display:flex;color:var(--t3,#9A958B)">{{ ic.chevR }}</span></div>
</sc-for>
</div>
</sc-if>

<div style="position:absolute;left:0;right:0;bottom:0;height:84px;box-sizing:border-box;padding-bottom:28px;display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--ln,#E4DFD4);background:var(--bg,#FAF8F3)">
<sc-for list="{{ tabbar }}" as="t" hint-placeholder-count="5">
<div onClick="{{ t.pick }}" style="position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:{{ t.color }};font-size:11px;font-weight:{{ t.weight }};cursor:pointer"><span style="display:flex;align-items:center;justify-content:center;width:{{ t.box }}px;height:{{ t.box }}px;border-radius:4px;background:{{ t.bg }};color:{{ t.icColor }}">{{ t.icon }}</span><span>{{ t.label }}</span><span style="position:absolute;top:6px;right:22px;width:6px;height:6px;border-radius:50%;background:{{ t.dot }}"></span></div>
</sc-for>
</div>
</div>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;modo&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;claro&quot;,&quot;oscuro&quot;],&quot;default&quot;:&quot;claro&quot;,&quot;tsType&quot;:&quot;'claro'|'oscuro'&quot;},&quot;formato&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;escritorio&quot;,&quot;movil&quot;],&quot;default&quot;:&quot;escritorio&quot;,&quot;tsType&quot;:&quot;'escritorio'|'movil'&quot;},&quot;activo&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;resumen&quot;,&quot;movimientos&quot;,&quot;cuentas&quot;,&quot;deudas&quot;,&quot;recurrentes&quot;,&quot;inversion&quot;,&quot;metas&quot;,&quot;avisos&quot;],&quot;default&quot;:&quot;cuentas&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;masAbierto&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
const SVG = (d, s = 20) => React.createElement('svg', { width: s, height: s, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 1.5, strokeLinecap: 'round', strokeLinejoin: 'round', dangerouslySetInnerHTML: { __html: d } });
const P = {
  resumen: '<line x1="18" x2="18" y1="20" y2="10"/><line x1="12" x2="12" y1="20" y2="4"/><line x1="6" x2="6" y1="20" y2="14"/>',
  movimientos: '<path d="M3 12h.01"/><path d="M3 18h.01"/><path d="M3 6h.01"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M8 6h13"/>',
  cuentas: '<path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/>',
  deudas: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  avisos: '<path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/>',
  recurrentes: '<path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/>',
  metas: '<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>',
  inversion: '<polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/>',
  plus: '<path d="M5 12h14"/><path d="M12 5v14"/>', mas: '<circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>'
};
const ICONS = { plus: SVG(P.plus, 18), chevR: SVG('<path d="m9 18 6-6-6-6"/>', 16) };
const MODES = {
  claro: { '--bg':'#FAF8F3','--sf':'#FFFFFF','--sk':'#F2EEE5','--tx':'#1A1A17','--t2':'#6B6760','--t3':'#9A958B','--ln':'#E4DFD4','--lf':'#1A1A17','--br':'#8A5F1F','--in':'#2F7D5A','--out':'#B0452E' },
  oscuro: { '--bg':'#12141A','--sf':'#181B22','--sk':'#1F232C','--tx':'#E8E4DC','--t2':'#8B8A84','--t3':'#5E5F63','--ln':'#272B34','--lf':'#8B8A84','--br':'#BC8A3E','--in':'#4E9E78','--out':'#D0664B' }
};
const NAV = [['resumen','Resumen'],['movimientos','Movimientos'],['cuentas','Cuentas'],['deudas','Deudas y préstamos'],['recurrentes','Recurrentes'],['inversion','Inversiones'],['metas','Metas'],['avisos','Avisos']];
const TABS = ['resumen','movimientos','cuentas'];
const BADGE = { avisos:'3' };

class Component extends DCLogic {
  state = { act: this.props.activo ?? 'cuentas', sheet: !!this.props.masAbierto };
  renderVals() {
    const s = this.state;
    const esc = (this.props.formato ?? 'escritorio') === 'escritorio';
    const on = k => s.act === k;
    const inMore = !TABS.includes(s.act);
    return {
      vars: MODES[this.props.modo ?? 'claro'] || MODES.claro, esc, mov: !esc, ic: ICONS,
      title: (NAV.find(n => n[0] === s.act) || NAV[2])[1],
      nav: NAV.map(([k, label]) => ({ label, icon: SVG(P[k]), badge: BADGE[k] || '', bg: on(k) ? 'var(--sk,#F2EEE5)' : 'transparent', color: on(k) ? 'var(--tx,#1A1A17)' : 'var(--t2,#6B6760)', weight: on(k) ? 600 : 400, pick: () => this.setState({ act:k }) })),
      tabbar: [['resumen','Resumen'],['movimientos','Movimientos'],['plus','Registrar'],['cuentas','Cuentas'],['mas','Más']].map(([k, label]) => {
        const a = k === 'mas' ? (inMore || s.sheet) : on(k) && !s.sheet;
        return { label, icon: SVG(P[k], k === 'plus' ? 22 : 20), box: k === 'plus' ? 40 : 24, bg: k === 'plus' ? 'var(--tx,#1A1A17)' : 'transparent', icColor: k === 'plus' ? 'var(--bg,#FAF8F3)' : 'inherit',
          color: a ? 'var(--tx,#1A1A17)' : 'var(--t2,#6B6760)', weight: a ? 600 : 400, dot: k === 'mas' && !s.sheet ? 'var(--br,#8A5F1F)' : 'transparent',
          pick: () => k === 'mas' ? this.setState({ sheet: !s.sheet }) : k === 'plus' ? null : this.setState({ act:k, sheet:false }) };
      }),
      sheet: s.sheet, closeSheet: () => this.setState({ sheet:false }),
      more: NAV.filter(n => !TABS.includes(n[0])).map(([k, label]) => ({ label, icon: SVG(P[k]), badge: BADGE[k] || '', color:'var(--tx,#1A1A17)', weight: on(k) ? 600 : 400, pick: () => this.setState({ act:k, sheet:false }) }))
    };
  }
}
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Familjen Grotesk',sans-serif;-webkit-font-smoothing:antialiased}
a{color:#8A5F1F}
a:hover{color:#1A1A17}
input::placeholder{color:var(--t3,#9A958B);opacity:1}
</style>
</helmet>
<div style="{{ vars }}">
<div data-screen-label="Captura rápida" style="width:390px;height:844px;position:relative;overflow:hidden;display:flex;flex-direction:column;background:var(--bg,#FAF8F3);color:var(--tx,#1A1A17);font-family:'Familjen Grotesk',sans-serif;border:1px solid var(--ln,#E4DFD4);border-radius:44px;box-sizing:border-box">

<div style="height:48px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:0 30px 6px;font-size:15px;font-weight:600"><span>9:41</span><span style="display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600"><span>5G</span><span style="width:24px;height:11px;border:1px solid var(--tx,#1A1A17);border-radius:3px;padding:1px;box-sizing:border-box;display:flex"><span style="width:70%;background:var(--tx,#1A1A17);border-radius:1px"></span></span></span></div>

<div style="height:52px;flex:none;display:flex;align-items:center;padding:0 12px 0 6px;gap:8px">
<button onClick="{{ onClose }}" aria-label="Cerrar" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:none;border:none;color:var(--tx,#1A1A17);cursor:pointer;padding:0">{{ ic.x }}</button>
<div style="display:flex;gap:18px;flex:1">
<sc-for list="{{ tabs }}" as="t" hint-placeholder-count="3">
<button onClick="{{ t.select }}" style="height:44px;padding:0;background:none;border:none;border-bottom:2px solid {{ t.line }};color:{{ t.color }};font-family:'Familjen Grotesk',sans-serif;font-size:15px;font-weight:{{ t.weight }};cursor:pointer">{{ t.label }}</button>
</sc-for>
</div>
<sc-if value="{{ showHoy }}" hint-placeholder-val="{{ true }}">
<div style="text-align:right;line-height:15px"><div style="font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--t2,#6B6760)">Hoy</div><div style="font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:500">{{ hoyText }}</div></div>
</sc-if>
</div>

<div style="flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:0 24px;gap:14px">
<div style="display:flex;align-items:baseline;gap:6px;max-width:100%">
<span style="font-family:'IBM Plex Mono',monospace;font-size:32px;font-weight:500;color:{{ signColor }}">{{ sign }}</span>
<span style="font-family:'IBM Plex Mono',monospace;font-size:{{ amtSize }}px;line-height:1;font-weight:500;letter-spacing:-0.03em;color:{{ amtColor }}">{{ amtText }}</span>
<span style="font-size:15px;font-weight:500;color:var(--t2,#6B6760)">COP</span>
</div>
<input value="{{ desc }}" onChange="{{ onDesc }}" placeholder="¿En qué? Escribe o elige abajo" style="width:280px;height:44px;text-align:center;background:none;border:none;border-bottom:1px solid var(--ln,#E4DFD4);outline:none;font-family:'Familjen Grotesk',sans-serif;font-size:17px;color:var(--tx,#1A1A17);padding:0">
<div style="height:16px;font-family:'IBM Plex Mono',monospace;font-size:12px;color:{{ hintColor }}">{{ hint }}</div>
</div>

<div style="height:56px;flex:none;display:flex;gap:8px;overflow-x:auto;padding:0 16px;align-items:flex-start;scrollbar-width:none">
<sc-for list="{{ chips }}" as="c" hint-placeholder-count="5">
<button onClick="{{ c.pick }}" style="flex:none;height:44px;padding:0 14px;border:1px solid {{ c.border }};border-radius:4px;background:var(--sf,#FFFFFF);color:var(--tx,#1A1A17);font-family:'Familjen Grotesk',sans-serif;font-size:15px;white-space:nowrap;cursor:pointer">{{ c.label }}</button>
</sc-for>
<sc-if value="{{ noChips }}" hint-placeholder-val="{{ false }}">
<div style="height:44px;display:flex;align-items:center;font-size:13px;color:var(--t2,#6B6760)">Tus conceptos frecuentes aparecerán aquí.</div>
</sc-if>
</div>

<div style="height:56px;flex:none;display:grid;grid-template-columns:1.25fr 1fr 0.9fr;border-top:1px solid var(--ln,#E4DFD4)">
<sc-for list="{{ meta }}" as="f" hint-placeholder-count="3">
<button onClick="{{ f.open }}" style="height:56px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:2px;padding:0 0 0 16px;background:none;border:none;border-left:{{ f.sep }};text-align:left;cursor:pointer;min-width:0;color:var(--tx,#1A1A17)">
<span style="font-family:'Familjen Grotesk',sans-serif;font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--t2,#6B6760)">{{ f.label }}</span>
<span style="display:flex;align-items:baseline;gap:6px;max-width:100%;font-family:'Familjen Grotesk',sans-serif;font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden"><span style="color:{{ f.color }};border-bottom:{{ f.under }};overflow:hidden;text-overflow:ellipsis">{{ f.value }}</span><span style="font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:400;color:var(--br,#8A5F1F)">{{ f.tag }}</span></span>
</button>
</sc-for>
</div>

<div style="flex:none;display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--ln,#E4DFD4);border-top:1px solid var(--ln,#E4DFD4);border-bottom:1px solid var(--ln,#E4DFD4)">
<sc-for list="{{ keys }}" as="k" hint-placeholder-count="12">
<button onClick="{{ k.press }}" aria-label="{{ k.aria }}" style="height:60px;display:flex;align-items:center;justify-content:center;background:var(--bg,#FAF8F3);border:none;color:var(--tx,#1A1A17);font-family:'IBM Plex Mono',monospace;font-size:26px;font-weight:400;cursor:pointer;padding:0" style-active="background:var(--sk,#F2EEE5)">{{ k.label }}</button>
</sc-for>
</div>

<div style="flex:none;padding:12px 16px 30px">
<button onClick="{{ onSave }}" style="width:100%;height:56px;display:flex;align-items:center;justify-content:center;gap:10px;border:none;border-radius:4px;background:{{ btnBg }};color:{{ btnColor }};font-family:'Familjen Grotesk',sans-serif;font-size:17px;font-weight:600;cursor:pointer">{{ btnLabel }}<span style="font-family:'IBM Plex Mono',monospace;font-weight:500">{{ btnAmt }}</span></button>
</div>

<sc-if value="{{ saved }}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;top:104px;left:16px;right:16px;height:48px;display:flex;align-items:center;gap:10px;padding:0 4px 0 14px;background:var(--sf,#FFFFFF);border:1px solid var(--ln,#E4DFD4);border-radius:4px;z-index:5">
<span style="display:flex;color:var(--in,#2F7D5A)">{{ ic.check }}</span>
<span style="flex:1;min-width:0;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ savedText }}</span>
<span style="font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:500;color:{{ savedColor }}">{{ savedAmt }}</span>
<button onClick="{{ onUndo }}" style="height:44px;padding:0 10px;background:none;border:none;font-family:'Familjen Grotesk',sans-serif;font-size:15px;font-weight:600;color:var(--br,#8A5F1F);cursor:pointer">Deshacer</button>
</div>
</sc-if>

<sc-if value="{{ sheetOpen }}" hint-placeholder-val="{{ false }}">
<div onClick="{{ closeSheet }}" style="position:absolute;inset:0;z-index:8"></div>
<div style="position:absolute;left:0;right:0;bottom:0;min-height:428px;z-index:9;background:var(--sf,#FFFFFF);border-top:1px solid var(--lf,#1A1A17);border-radius:6px 6px 0 0;padding:0 16px 34px;box-sizing:border-box;display:flex;flex-direction:column">
<div style="height:56px;display:flex;align-items:center;justify-content:space-between"><span style="font-size:17px;font-weight:600">{{ sheetTitle }}</span><button onClick="{{ closeSheet }}" style="height:44px;padding:0 4px;background:none;border:none;font-family:'Familjen Grotesk',sans-serif;font-size:15px;font-weight:600;color:var(--br,#8A5F1F);cursor:pointer">Listo</button></div>
<sc-if value="{{ sheetIsCat }}" hint-placeholder-val="{{ false }}">
<div style="display:flex;flex-wrap:wrap;gap:8px">
<sc-for list="{{ catList }}" as="c" hint-placeholder-count="8">
<button onClick="{{ c.pick }}" style="height:44px;display:flex;align-items:center;gap:6px;padding:0 14px;border:1px solid {{ c.border }};border-radius:4px;background:var(--sf,#FFFFFF);color:var(--tx,#1A1A17);font-family:'Familjen Grotesk',sans-serif;font-size:15px;font-weight:{{ c.weight }};cursor:pointer"><span style="display:flex">{{ c.mark }}</span>{{ c.label }}</button>
</sc-for>
</div>
</sc-if>
<sc-if value="{{ sheetIsList }}" hint-placeholder-val="{{ false }}">
<div style="display:flex;flex-direction:column;border-top:1px solid var(--ln,#E4DFD4)">
<sc-for list="{{ listRows }}" as="r" hint-placeholder-count="4">
<button onClick="{{ r.pick }}" style="min-height:60px;display:grid;grid-template-columns:20px minmax(0,1fr) auto 20px;gap:12px;align-items:center;padding:0 4px;background:none;border:none;border-bottom:1px solid var(--ln,#E4DFD4);color:var(--tx,#1A1A17);text-align:left;cursor:pointer">
<span style="display:flex;color:var(--t2,#6B6760)">{{ r.icon }}</span>
<span style="display:flex;flex-direction:column;font-family:'Familjen Grotesk',sans-serif"><span style="font-size:15px;font-weight:500">{{ r.name }}</span><span style="font-size:13px;color:var(--t2,#6B6760)">{{ r.sub }}</span></span>
<span style="display:flex;flex-direction:column;align-items:flex-end"><span style="font-family:'Familjen Grotesk',sans-serif;font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--t2,#6B6760)">{{ r.pre }}</span><span style="font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:500">{{ r.amt }}</span></span>
<span style="display:flex;color:var(--tx,#1A1A17)">{{ r.mark }}</span>
</button>
</sc-for>
</div>
</sc-if>
</div>
</sc-if>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;modo&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;claro&quot;,&quot;oscuro&quot;],&quot;default&quot;:&quot;claro&quot;,&quot;tsType&quot;:&quot;'claro'|'oscuro'&quot;},&quot;escenario&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;normal&quot;,&quot;primer-dia&quot;],&quot;default&quot;:&quot;normal&quot;,&quot;tsType&quot;:&quot;'normal'|'primer-dia'&quot;}}">
const SVG = (d, s = 20) => React.createElement('svg', { width: s, height: s, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 1.5, strokeLinecap: 'round', strokeLinejoin: 'round', dangerouslySetInnerHTML: { __html: d } });
const ICONS = {
  x: SVG('<path d="M18 6 6 18"/><path d="m6 6 12 12"/>', 22),
  del: SVG('<path d="M10 5a2 2 0 0 0-1.344.519l-6.328 5.74a1 1 0 0 0 0 1.481l6.328 5.741A2 2 0 0 0 10 19h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2z"/><path d="m12 9 6 6"/><path d="m18 9-6 6"/>', 26),
  check: SVG('<path d="M20 6 9 17l-5-5"/>', 18),
  checkS: SVG('<path d="M20 6 9 17l-5-5"/>', 16),
  efectivo: SVG('<path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/>'),
  banco: SVG('<line x1="3" x2="21" y1="22" y2="22"/><line x1="6" x2="6" y1="18" y2="11"/><line x1="10" x2="10" y1="18" y2="11"/><line x1="14" x2="14" y1="18" y2="11"/><line x1="18" x2="18" y1="18" y2="11"/><polygon points="12 2 20 7 4 7"/>'),
  tarjeta: SVG('<rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/>'),
  fecha: SVG('<rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/>')
};
const MODES = {
  claro: { '--bg':'#FAF8F3','--sf':'#FFFFFF','--sk':'#F2EEE5','--tx':'#1A1A17','--t2':'#6B6760','--t3':'#9A958B','--ln':'#E4DFD4','--lf':'#1A1A17','--br':'#8A5F1F','--in':'#2F7D5A','--out':'#B0452E', width:390, height:844 },
  oscuro: { '--bg':'#12141A','--sf':'#181B22','--sk':'#1F232C','--tx':'#E8E4DC','--t2':'#8B8A84','--t3':'#5E5F63','--ln':'#272B34','--lf':'#8B8A84','--br':'#BC8A3E','--in':'#4E9E78','--out':'#D0664B', width:390, height:844 }
};
const RULES = [
  [/almuerzo|corrientazo|restaurante|desayuno|cena|tinto|caf[eé]|empanada|arepa|comida/i, 'Comida'],
  [/pasaje|transmilenio|sitp|bus|uber|didi|taxi|parqueadero|gasolina/i, 'Transporte'],
  [/recarga|datos|celular|minutos/i, 'Celular'],
  [/tienda|d1|\bara\b|[eé]xito|mercado|ol[ií]mpica|carulla/i, 'Mercado'],
  [/farmacia|droguer|m[eé]dico|eps/i, 'Salud'],
  [/netflix|spotify|cine|cerveza|\bbar\b/i, 'Ocio'],
  [/n[oó]mina|salario|sueldo/i, 'Salario'],
  [/freelance|honorarios|proyecto/i, 'Trabajo independiente'],
  [/reembolso|devoluci/i, 'Reembolso']
];
const CATS = {
  gasto: ['Comida','Transporte','Celular','Mercado','Hogar','Salud','Ocio','Servicios','Otros gastos'],
  ingreso: ['Salario','Trabajo independiente','Reembolso','Otros ingresos']
};
const CHIPS = {
  gasto: ['Almuerzo','Pasaje','Recarga datos','Tinto','Tienda','Parqueadero'],
  ingreso: ['Nómina','Freelance','Reembolso'],
  transferencia: ['Retiro cajero','Pago tarjeta','Recarga Nequi']
};
const ACCTS = {
  normal: [
    { id:'nequi', name:'Nequi', sub:'Banco digital', icon:'banco', bal:412300 },
    { id:'efectivo', name:'Efectivo', sub:'Billetera', icon:'efectivo', bal:85000 },
    { id:'bancolombia', name:'Bancolombia Ahorros', sub:'Banco', icon:'banco', bal:3240500 },
    { id:'visa', name:'Visa Oro', sub:'Tarjeta de crédito', icon:'tarjeta', bal:1267900, pasivo:true }
  ],
  'primer-dia': [
    { id:'efectivo', name:'Efectivo', sub:'Billetera', icon:'efectivo', bal:50000 },
    { id:'bancolombia', name:'Bancolombia Ahorros', sub:'Banco', icon:'banco', bal:1200000 }
  ]
};
const DATES = [['Hoy','mié 4 nov'],['Ayer','mar 3 nov'],['Anteayer','lun 2 nov']];
const fmt = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
const ruleFor = t => { for (const [re, c] of RULES) { const m = t.match(re); if (m) return { cat: c, kw: m[0].toLowerCase() }; } return null; };

class Component extends DCLogic {
  constructor(p) {
    super(p);
    const esc = this.props.escenario ?? 'normal';
    const acc = ACCTS[esc] || ACCTS.normal;
    this.state = { amt:'', desc:'', cat:null, auto:null, chip:null, tipo:'gasto', acct:acc[0].id, to:acc[1].id, date:0, sheet:null, saved:null, hoy: esc === 'normal' ? [3200, 2500] : [] };
  }
  componentWillUnmount() { clearTimeout(this.t); }
  setDesc(desc, chip = null) {
    const r = ruleFor(desc);
    const s = { desc, chip };
    if (r && this.state.tipo !== 'transferencia' && CATS[this.state.tipo].includes(r.cat)) { s.cat = r.cat; s.auto = r.kw; }
    else if (this.state.auto) { s.cat = null; s.auto = null; }
    this.setState(s);
  }
  press(k) {
    this.setState(s => {
      let a = s.amt;
      if (k === 'del') a = a.slice(0, -1);
      else if (a.length < 10) { if (a === '' && (k === '0' || k === '000')) return null; a = (a + k).slice(0, 10); }
      return { amt: a };
    });
  }
  save() {
    const s = this.state; const n = parseInt(s.amt || '0', 10); if (!n) return;
    const accs = ACCTS[this.props.escenario ?? 'normal'] || ACCTS.normal;
    const an = id => (accs.find(a => a.id === id) || {}).name;
    const label = s.desc || s.cat || (s.tipo === 'ingreso' ? 'Ingreso' : s.tipo === 'gasto' ? 'Gasto' : 'Transferencia');
    const where = s.tipo === 'transferencia' ? `${an(s.acct)} → ${an(s.to)}` : an(s.acct);
    const prev = { amt:s.amt, desc:s.desc, cat:s.cat, auto:s.auto, chip:s.chip, hoy:s.hoy };
    const hoy = s.tipo === 'gasto' && s.date === 0 ? [...s.hoy, n] : s.hoy;
    clearTimeout(this.t);
    this.setState({ amt:'', desc:'', cat:null, auto:null, chip:null, hoy, saved:{ text:`${label} · ${where}`, n, tipo:s.tipo, prev } });
    this.t = setTimeout(() => this.setState({ saved:null }), 5000);
  }
  undo() { const p = this.state.saved && this.state.saved.prev; clearTimeout(this.t); if (p) this.setState({ ...p, saved:null }); }
  renderVals() {
    const s = this.state;
    const esc = this.props.escenario ?? 'normal';
    const accs = ACCTS[esc] || ACCTS.normal;
    const modo = this.props.modo ?? 'claro';
    const n = parseInt(s.amt || '0', 10);
    const amtText = n ? fmt(n) : '0';
    const L = amtText.length;
    const isT = s.tipo === 'transferencia';
    const tipoWord = { gasto:'gasto', ingreso:'ingreso', transferencia:'transferencia' }[s.tipo];
    const accName = id => (accs.find(a => a.id === id) || {}).name || '';
    const chipList = esc === 'normal' ? CHIPS[s.tipo] : [];
    const hoySum = s.hoy.reduce((a, b) => a + b, 0);
    let hint = '', hintColor = 'var(--t2,#6B6760)';
    if (s.auto) { hint = `Regla «${s.auto}» → ${s.cat}`; hintColor = 'var(--br,#8A5F1F)'; }
    else if (s.desc && s.cat && !isT) hint = `Nueva regla: «${s.desc.toLowerCase()}» → ${s.cat}`;
    const metaCat = { label:'Categoría', value: s.cat || 'Sin categoría', tag: s.auto ? 'auto' : '', color: s.cat ? 'var(--tx,#1A1A17)' : 'var(--t2,#6B6760)', under: s.cat ? 'none' : '1px dashed var(--t3,#9A958B)', open: () => this.setState({ sheet:'cat' }) };
    const metaAcc = { label: isT ? 'Desde' : 'Cuenta', value: accName(s.acct), tag:'', color:'var(--tx,#1A1A17)', under:'none', open: () => this.setState({ sheet:'acct' }) };
    const metaTo = { label:'Hacia', value: accName(s.to), tag:'', color:'var(--tx,#1A1A17)', under:'none', open: () => this.setState({ sheet:'to' }) };
    const metaDate = { label:'Fecha', value: DATES[s.date][0], tag:'', color:'var(--tx,#1A1A17)', under:'none', open: () => this.setState({ sheet:'date' }) };
    const meta = (isT ? [metaAcc, metaTo, metaDate] : [metaCat, metaAcc, metaDate]).map((m, i) => ({ ...m, sep: i ? '1px solid var(--ln,#E4DFD4)' : 'none' }));
    const keys = ['1','2','3','4','5','6','7','8','9','000','0','del'].map(k => ({ label: k === 'del' ? ICONS.del : k, aria: k === 'del' ? 'Borrar' : k, press: () => this.press(k) }));
    let listRows = [], sheetTitle = '';
    if (s.sheet === 'acct' || s.sheet === 'to') {
      const key = s.sheet === 'acct' ? 'acct' : 'to';
      sheetTitle = s.sheet === 'to' ? 'Hacia' : isT ? 'Desde' : 'Cuenta';
      listRows = accs.map(a => ({ icon: ICONS[a.icon], name: a.name, sub: a.pasivo ? `${a.sub} · pasivo` : a.sub, pre: a.pasivo ? 'Debes' : '', amt: fmt(a.bal), mark: s[key] === a.id ? ICONS.checkS : null, pick: () => this.setState({ [key]: a.id, sheet:null }) }));
    } else if (s.sheet === 'date') {
      sheetTitle = 'Fecha';
      listRows = DATES.map((d, i) => ({ icon: ICONS.fecha, name: d[0], sub: d[1], pre:'', amt:'', mark: s.date === i ? ICONS.checkS : null, pick: () => this.setState({ date:i, sheet:null }) }));
    } else if (s.sheet === 'cat') sheetTitle = 'Categoría';
    const catList = (CATS[s.tipo] || []).map(c => ({ label:c, border: s.cat === c ? 'var(--tx,#1A1A17)' : 'var(--ln,#E4DFD4)', weight: s.cat === c ? 600 : 400, mark: s.cat === c ? ICONS.checkS : null, pick: () => this.setState({ cat: s.cat === c ? null : c, auto:null, sheet:null }) }));
    const sv = s.saved;
    return {
      vars: MODES[modo] || MODES.claro,
      ic: ICONS,
      onClose: () => this.setState({ amt:'', desc:'', cat:null, auto:null, chip:null }),
      tabs: [['gasto','Gasto'],['ingreso','Ingreso'],['transferencia','Transferir']].map(([id, label]) => ({ label, color: s.tipo === id ? 'var(--tx,#1A1A17)' : 'var(--t2,#6B6760)', weight: s.tipo === id ? 600 : 400, line: s.tipo === id ? 'var(--tx,#1A1A17)' : 'transparent', select: () => this.setState({ tipo:id, cat:null, auto:null, chip:null }) })),
      showHoy: s.hoy.length > 0,
      hoyText: '−' + fmt(hoySum),
      sign: n ? (s.tipo === 'gasto' ? '−' : s.tipo === 'ingreso' ? '+' : '') : '',
      signColor: s.tipo === 'gasto' ? 'var(--out,#B0452E)' : 'var(--in,#2F7D5A)',
      amtText, amtSize: L <= 7 ? 64 : L <= 9 ? 52 : 44,
      amtColor: n ? 'var(--tx,#1A1A17)' : 'var(--t3,#9A958B)',
      desc: s.desc, onDesc: e => this.setDesc(e.target.value),
      hint, hintColor,
      chips: chipList.map(c => ({ label:c, border: s.chip === c ? 'var(--tx,#1A1A17)' : 'var(--ln,#E4DFD4)', pick: () => s.chip === c ? this.setDesc('') : this.setDesc(c, c) })),
      noChips: chipList.length === 0,
      meta, keys,
      onSave: () => this.save(),
      btnBg: n ? 'var(--tx,#1A1A17)' : 'var(--ln,#E4DFD4)',
      btnColor: n ? 'var(--bg,#FAF8F3)' : 'var(--t2,#6B6760)',
      btnLabel: `Registrar ${tipoWord}`,
      btnAmt: n ? fmt(n) : '',
      saved: !!sv,
      savedText: sv ? sv.text : '',
      savedAmt: sv ? (sv.tipo === 'gasto' ? '−' : sv.tipo === 'ingreso' ? '+' : '') + fmt(sv.n) : '',
      savedColor: sv ? (sv.tipo === 'gasto' ? 'var(--out,#B0452E)' : sv.tipo === 'ingreso' ? 'var(--in,#2F7D5A)' : 'var(--tx,#1A1A17)') : '',
      onUndo: () => this.undo(),
      sheetOpen: !!s.sheet, sheetTitle,
      sheetIsCat: s.sheet === 'cat', sheetIsList: !!s.sheet && s.sheet !== 'cat',
      closeSheet: () => this.setState({ sheet:null }),
      catList, listRows
    };
  }
}
</script>
</body>
</html>
